server:
  shutdown: graceful
  port: 8083

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: bff-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 500ms

tayjava:
  clients:
    course-base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8081}
    enrollment-base-url: ${ENROLLMENT_SERVICE_BASE_URL:http://localhost:8082}
    order-base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8084}
    connect-timeout: 200ms
    read-timeout: 2s

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
    baggage:
      remote-fields:
        - X-Correlation-Id
      correlation:
        fields:
          - X-Correlation-Id
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
