server:
  port: 8083

spring:
  application:
    name: bff-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 500ms

tayjava:
  clients:
    course-base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8081}
    enrollment-base-url: ${ENROLLMENT_SERVICE_BASE_URL:http://localhost:8082}
    order-base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8084}
    connect-timeout: 200ms
    read-timeout: 2s

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
