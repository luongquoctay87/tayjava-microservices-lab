spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:order;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

tayjava:
  kafka:
    enabled: false

management:
  tracing:
    export:
      enabled: false

spring.task.scheduling.enabled: false
