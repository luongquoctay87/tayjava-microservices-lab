spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:course;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  grpc:
    server:
      port: 0
  data:
    redis:
      host: 127.0.0.1
      port: 9
      connect-timeout: 100ms
      timeout: 100ms

management:
  tracing:
    export:
      enabled: false
