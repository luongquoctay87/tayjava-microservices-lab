server:
  port: 8081

spring:
  application:
    name: course-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 500ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/course_db}
    username: ${SPRING_DATASOURCE_USERNAME:course_app}
    password: ${SPRING_DATASOURCE_PASSWORD:course_app_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  grpc:
    server:
      port: ${COURSE_GRPC_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
