server:
  port: 8080

spring:
  application:
    name: gateway-service
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 200ms
      timeout: 200ms
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 2s
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:3000"
                allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
                allowedHeaders: "*"
          routes:
            - id: courses-featured
              order: 0
              uri: ${BFF_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/courses/featured
              filters:
                - SetPath=/api/v1/featured-courses
            - id: order-pay
              order: 1
              uri: ${ORDER_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/orders/*/pay
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    key-resolver: "#{@userOrIpKeyResolver}"
            - id: course-v0-rewrite
              order: 5
              uri: ${COURSE_URI:http://localhost:8081}
              predicates:
                - Path=/api/courses,/api/courses/**
              filters:
                - RewritePath=/api/courses(?<segment>/?.*), /api/v1/courses$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
            - id: course-legacy-strip
              order: 5
              uri: ${COURSE_URI:http://localhost:8081}
              predicates:
                - Path=/course-service/api/v1/courses,/course-service/api/v1/courses/**
              filters:
                - StripPrefix=1
            - id: course
              order: 10
              uri: ${COURSE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/courses,/api/v1/courses/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
            - id: enrollment
              order: 10
              uri: ${ENROLLMENT_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/enrollments,/api/v1/enrollments/**,/api/v1/purchases,/api/v1/purchases/**
            - id: order
              order: 10
              uri: ${ORDER_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**
            - id: bff
              order: 10
              uri: ${BFF_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/me,/api/v1/me/**,/api/v1/featured-courses,/api/v1/checkout-status,/api/v1/checkout-status/**

tayjava:
  gateway:
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: false
  endpoint:
    gateway:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
