# File: compose.yaml
name: tayjava-microservices-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tayjava
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tayjava}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tayjava-pg-data:/var/lib/postgresql/data
      - ./ddl:/docker-entrypoint-initdb.d:ro
    networks:
      - tayjava-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tayjava -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    networks:
      - tayjava-net
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tayjava-net
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/course_db
      SPRING_DATASOURCE_USERNAME: course_app
      SPRING_DATASOURCE_PASSWORD: ${COURSE_DB_PASSWORD:-course_app_pw}
      COURSE_GRPC_PORT: "9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  enrollment-service:
    build:
      context: .
      dockerfile: enrollment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      course-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tayjava-net
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enrollment_db
      SPRING_DATASOURCE_USERNAME: enrollment_app
      SPRING_DATASOURCE_PASSWORD: ${ENROLLMENT_DB_PASSWORD:-enrollment_app_pw}
      COURSE_SERVICE_BASE_URL: http://course-service:8081
      COURSE_SERVICE_GRPC_ADDRESS: static://course-service:9091
      COURSE_TRANSPORT: grpc
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tayjava-net
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_app
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:-order_app_pw}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  bff-service:
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    depends_on:
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
    networks:
      - tayjava-net
    ports:
      - "8083:8083"
    environment:
      COURSE_SERVICE_BASE_URL: http://course-service:8081
      ENROLLMENT_SERVICE_BASE_URL: http://enrollment-service:8082
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    networks:
      - tayjava-net
    ports:
      - "8080:8080"
    environment:
      COURSE_URI: http://course-service:8081
      ENROLLMENT_URI: http://enrollment-service:8082
      ORDER_URI: http://order-service:8084
      BFF_URI: http://bff-service:8083
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

networks:
  tayjava-net:
    driver: bridge

volumes:
  tayjava-pg-data:
