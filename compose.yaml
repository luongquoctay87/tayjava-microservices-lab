# File: compose.yaml
name: tayjava-microservices-lab

services:
  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    networks:
      - tayjava-net
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  enrollment-service:
    build:
      context: .
      dockerfile: enrollment-service/Dockerfile
    networks:
      - tayjava-net
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

networks:
  tayjava-net:
    driver: bridge
