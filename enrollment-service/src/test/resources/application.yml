spring:
  datasource:
    url: jdbc:h2:mem:enrollment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  grpc:
    client:
      enabled: false

tayjava:
  clients:
    # Tests mock CourseClient; keep HTTP RestClient available for unit client tests.
    course-transport: rest
    course-base-url: http://localhost:8081
    course-connect-timeout: 200ms
    course-read-timeout: 1s
    course-retry-max-attempts: 3
    course-retry-backoff: 1ms
