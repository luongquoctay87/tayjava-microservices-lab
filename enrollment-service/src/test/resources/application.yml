spring:
  datasource:
    url: jdbc:h2:mem:enrollment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  grpc:
    client:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

tayjava:
  kafka:
    enabled: false
  clients:
    course-transport: rest
    course-base-url: http://localhost:8081
    course-connect-timeout: 200ms
    course-read-timeout: 1s

resilience4j:
  circuitbreaker:
    instances:
      course:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 1s
  retry:
    instances:
      course:
        maxAttempts: 2
        waitDuration: 1ms
  bulkhead:
    instances:
      course:
        maxConcurrentCalls: 20
        maxWaitDuration: 0
