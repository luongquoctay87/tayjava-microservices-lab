server:
  port: 8082

spring:
  application:
    name: enrollment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    config:
      fail-fast: ${CONFIG_FAIL_FAST:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enrollment_db}
    username: ${SPRING_DATASOURCE_USERNAME:enrollment_app}
    password: ${SPRING_DATASOURCE_PASSWORD:enrollment_app_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  grpc:
    client:
      channels:
        course:
          address: ${COURSE_SERVICE_GRPC_ADDRESS:static://localhost:9091}
          negotiation-type: plaintext
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

tayjava:
  kafka:
    enabled: true
  clients:
    # grpc (default) | rest | web
    course-transport: ${COURSE_TRANSPORT:grpc}
    course-base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8081}
    course-connect-timeout: 200ms
    course-read-timeout: 1s

resilience4j:
  circuitbreaker:
    instances:
      course:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      course:
        maxAttempts: 3
        waitDuration: 50ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  bulkhead:
    instances:
      course:
        maxConcurrentCalls: 20
        maxWaitDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
