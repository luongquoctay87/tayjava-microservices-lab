server:
  port: 8082

spring:
  application:
    name: enrollment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enrollment_db}
    username: ${SPRING_DATASOURCE_USERNAME:enrollment_app}
    password: ${SPRING_DATASOURCE_PASSWORD:enrollment_app_pw}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

tayjava:
  clients:
    course-base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8081}
    course-connect-timeout: 200ms
    course-read-timeout: 1s
    course-retry-max-attempts: 3
    course-retry-backoff: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
