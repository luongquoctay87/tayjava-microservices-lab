# Docs / lab example only — not wired into an alertmanager.
groups:
  - name: checkout-symptoms
    rules:
      - alert: EnrollmentHighErrorRatio
        expr: |
          sum(rate(http_server_requests_seconds_count{application="enrollment-service",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="enrollment-service"}[5m]))
          > 0.02
        for: 5m
        labels:
          severity: page
