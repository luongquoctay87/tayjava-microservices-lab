global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: tayjava-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-service:8080
          - course-service:8081
          - enrollment-service:8082
          - bff-service:8083
          - order-service:8084
